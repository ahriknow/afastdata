name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish afastdata-macro
        run: cargo publish -p afastdata-macro --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for afastdata-macro to be available
        run: sleep 30

      - name: Publish afastdata
        run: cargo publish -p afastdata --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
